<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadrontech Business Management System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="topbar">
  <div class="brand" id="brandBlock">
    <div class="brand-mark" id="brandMark"></div>
    <div class="brand-text" id="brandText">HADRONTECH<span class="sub">Business Management System</span></div>
  </div>
  <div class="header-user">Offline · Local Data Only</div>
</div>

<div class="app-sidebar">
  <a href="#/dashboard" class="nav-link" data-section="/dashboard">📊 Dashboard</a>
  <div class="nav-divider"></div>
  <a href="#/customers" class="nav-link" data-section="/customers">🏢 Customers</a>
  <a href="#/suppliers" class="nav-link" data-section="/suppliers">🚚 Suppliers</a>
  <a href="#/products" class="nav-link" data-section="/products">📦 Products &amp; Services</a>
  <div class="nav-divider"></div>
  <a href="#/quotations" class="nav-link" data-section="/quotations">📄 Quotations</a>
  <a href="#/customer-pos" class="nav-link" data-section="/customer-pos">📥 Customer POs</a>
  <a href="#/sales-orders" class="nav-link" data-section="/sales-orders">🧾 Sales Orders</a>
  <a href="#/supplier-pos" class="nav-link" data-section="/supplier-pos">📤 Supplier POs</a>
  <div class="nav-divider"></div>
  <a href="#/reports" class="nav-link" data-section="/reports">📈 Reports</a>
  <a href="#/search" class="nav-link" data-section="/search">🔍 Search</a>
  <a href="#/settings" class="nav-link" data-section="/settings">⚙️ Settings</a>
  <a href="#/settings/backup" class="nav-link" data-section="/settings">💾 Backup &amp; Restore</a>
</div>

<div class="app-main">
  <div id="backupBanner"></div>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="content"></div>
</div>

<!-- Load order matters: db/utils/router first, entity engine next, then
     the entities/modules that register routes, then app.js last which
     boots everything once all routes are registered. -->
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/router.js"></script>
<script src="js/entities.js"></script>
<script src="js/customers.js"></script>
<script src="js/suppliers.js"></script>
<script src="js/products.js"></script>
<script src="js/quotations.js"></script>
<script src="js/customerPOs.js"></script>
<script src="js/salesOrders.js"></script>
<script src="js/supplierPOs.js"></script>
<script src="js/proformaInvoices.js"></script>
<script src="js/print.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/reports.js"></script>
<script src="js/search.js"></script>
<script src="js/settings.js"></script>
<script src="js/backup.js"></script>
<script src="js/backupReminder.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
